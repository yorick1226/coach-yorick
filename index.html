<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0C0E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coach">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" href="icon-192.png?v=2">
<link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" href="splash-1179x2556.png">
<link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" href="splash-1290x2796.png">
<link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" href="splash-1170x2532.png">
<link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)" href="splash-1125x2436.png">
<title>Coach</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header>
  <div class="hrow">
    <button class="btn sm" id="back" aria-label="Terug" style="display:none">← Terug</button>
    <button class="btn sm" id="prev" aria-label="Vorige">‹</button>
    <h1 id="htitle">Coach</h1>
    <button class="btn sm" id="next" aria-label="Volgende">›</button>
  </div>
</header>
<main id="view"><p class="mut">Laden…</p></main>
<div id="rp" role="dialog" aria-label="Routine"></div>
<div id="timer"><button id="ring" aria-label="Rusttimer"><i id="tfill"></i><span class="tl">Rust</span><span class="t" id="tval">0:00</span></button>
  <div id="tctl"><button class="btn sm" data-tadd="-15">−15</button><button class="btn sm" data-tadd="15">+15</button><button class="btn sm" id="tstop">Stop</button></div></div>
<div id="flash">RUST VOORBIJ</div>
<div class="toast" id="toast"></div>
<nav class="tabs" id="tabs">
  <button data-tab="vandaag"><span><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>Vandaag</button>
  <button data-tab="week"><span><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M7 14h3M7 17h6"/></svg></span>Plan</button>
  <button data-tab="inzicht"><span><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><path d="M5 16l4-5 4 3 6-8"/><path d="M15 6h4v4"/></svg></span>Voortgang</button>
  <button data-tab="meer"><span><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/></svg></span>Meer</button>
</nav>
<script src="js/core.js"></script>
<script src="js/views.js"></script>
<script src="js/insight.js"></script>
<script src="js/coach.js"></script>
<script src="js/checkin.js"></script>
<script src="js/app.js"></script>
</body>
</html>
