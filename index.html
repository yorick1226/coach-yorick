<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coach">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Coach</title>
<style>
:root{--bg:#0d0f12;--card:#171a1f;--card2:#1f232a;--line:#2a2f37;--tx:#eef1f5;--mut:#9aa3ae;--acc:#4ade80;--acc2:#22c55e;--warn:#f5b942;--bad:#f87171;--blue:#60a5fa;--str:#fc6a2c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(150px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 12px;border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:8px}
.hrow h1{font-size:18px;margin:0;flex:1;text-align:center}
main{padding:12px 12px 0;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.day{margin-bottom:14px}
.day h2{font-size:16px;margin:4px 2px 8px;color:var(--mut);font-weight:600}
.day h2::first-letter{text-transform:uppercase}
.day.today h2{color:var(--acc)}
.sess.done{border-color:#1f5134;background:#132018}
.sess.skip{opacity:.55}
.st{display:flex;gap:10px;align-items:flex-start}
.st .tt{flex:1;min-width:0}
.tt b{display:block;font-size:17px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--card2);color:var(--mut);margin-right:6px;text-transform:uppercase;letter-spacing:.03em}
.det{white-space:pre-wrap;color:#cfd5dc;font-size:15px;margin:8px 0 0}
.mut{color:var(--mut);font-size:14px}
.small{font-size:13px;color:var(--mut)}
.btn{min-height:48px;min-width:48px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--tx);font:inherit;font-weight:600;padding:0 14px;cursor:pointer}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--acc2);border-color:var(--acc2);color:#04140a}
.btn.warn{background:#3a2a0b;border-color:var(--warn);color:var(--warn)}
.btn.bad{background:#3a1414;border-color:var(--bad);color:var(--bad)}
.btn.sm{min-height:44px;padding:0 10px;font-size:15px}
.btn.link{background:none;border:0;color:var(--blue);padding:0 4px;min-height:44px}
.chk{width:52px;height:52px;border-radius:14px;border:2px solid var(--line);background:var(--card2);color:transparent;font-size:26px;font-weight:800;flex:none}
.chk.on{background:var(--acc2);border-color:var(--acc2);color:#04140a}
.chk.st2{border-color:var(--str);color:var(--str)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.row>*{flex:1 1 auto;min-width:0}
.row.nw{flex-wrap:nowrap}
.row.nw input.num{flex:0 0 84px;width:84px}
input,select,textarea{font:inherit;color:var(--tx);background:#0f1216;border:1px solid var(--line);border-radius:12px;min-height:48px;padding:10px 12px;width:100%}
textarea{min-height:84px}
input.num{width:100px;flex:0 0 100px;text-align:center}
label.f{display:block;font-size:14px;color:var(--mut);margin:10px 2px 4px}
.banner{border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:15px}
.banner.concept{background:#2b2108;border:1px solid var(--warn);color:var(--warn)}
.banner.def{background:#0f2417;border:1px solid #1f5134;color:var(--acc)}
.banner.info{background:#0f1a2a;border:1px solid #23406a;color:#bcd6ff}
.banner.rood{background:#3a1414;border:1px solid var(--bad);color:#ffd0d0}
.banner.oranje{background:#2b2108;border:1px solid var(--warn);color:#ffe7b0}
.banner.groen{background:#0f2417;border:1px solid #1f5134;color:#c9f7d8}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{min-width:48px;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--tx);font:inherit;font-weight:700;font-size:17px;padding:0 10px}
.chip.on{background:var(--blue);border-color:var(--blue);color:#06101f}
.chip.tgt{border-color:var(--acc)}
.chips.sm .chip{min-width:44px;min-height:44px;font-size:15px}
.kg{display:flex;align-items:center;gap:8px;margin-top:10px}
.kg input{flex:1;text-align:center;font-size:22px;font-weight:700}
.sets{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.set{background:#0f2417;border:1px solid #1f5134;border-radius:10px;padding:6px 8px;font-size:15px;display:flex;align-items:center;gap:6px}
.set button{background:none;border:0;color:var(--bad);font-size:20px;min-width:36px;min-height:36px}
.hint{font-size:14px;margin-top:6px}
.hint.sug{color:var(--acc)}
.strava{margin-top:8px;padding:8px 10px;border-radius:10px;background:#2a160c;border:1px solid #6b3415;font-size:15px}
.strava b{color:var(--str)}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;display:grid;grid-template-columns:repeat(6,1fr);background:#0b0d10;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{background:none;border:0;color:var(--mut);font:inherit;font-size:12px;font-weight:600;min-height:58px;padding:4px 0}
nav.tabs button span{display:block;font-size:20px;line-height:1.2}
nav.tabs button.on{color:var(--acc)}
#timer{position:fixed;left:8px;right:8px;bottom:calc(66px + env(safe-area-inset-bottom));z-index:7;background:#11331f;border:1px solid var(--acc2);border-radius:14px;padding:8px 10px;display:none;align-items:center;gap:8px;max-width:624px;margin:0 auto}
#timer.show{display:flex}
#timer.end{background:#3a2a0b;border-color:var(--warn)}
#timer .t{flex:1;font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
#flash{position:fixed;inset:0;z-index:20;background:var(--acc2);display:none;align-items:center;justify-content:center;font-size:44px;font-weight:900;color:#04140a;pointer-events:none}
#flash.show{display:flex;animation:fl 1.6s ease-out forwards}
@keyframes fl{0%{opacity:1}70%{opacity:.9}100%{opacity:0}}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:13px}
td.r,th.r{text-align:right}
.calc{background:#0f1a2a;border:1px solid #23406a;border-radius:12px;padding:10px;margin-top:10px;font-size:15px}
.calc b{color:var(--blue)}
h3{margin:4px 0 6px;font-size:17px}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--acc2);color:#04140a;font-weight:700;padding:10px 16px;border-radius:12px;z-index:21;display:none;max-width:90vw;text-align:center}
.bar{height:10px;border-radius:6px;background:var(--card2);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--acc2)}
.kv{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv:last-child{border-bottom:0}
.kv span:last-child{font-variant-numeric:tabular-nums;text-align:right}
svg text{fill:var(--mut);font-size:10px}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:700;margin-left:4px}
.pill.o{background:#2b2108;color:var(--warn)}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <button class="btn sm" id="prev" aria-label="Vorige">‹</button>
    <h1 id="htitle">Coach</h1>
    <button class="btn sm" id="next" aria-label="Volgende">›</button>
  </div>
</header>
<main id="view"><p class="mut">Laden…</p></main>
<div id="timer"><div class="t" id="tval">0:00</div>
  <button class="btn sm" data-tadd="-15">−15</button><button class="btn sm" data-tadd="15">+15</button><button class="btn sm" id="tstop">Stop</button></div>
<div id="flash">RUST VOORBIJ</div>
<div class="toast" id="toast"></div>
<nav class="tabs" id="tabs">
  <button data-tab="vandaag"><span>☀️</span>Vandaag</button>
  <button data-tab="week"><span>📅</span>Week</button>
  <button data-tab="log"><span>🏋️</span>Logger</button>
  <button data-tab="inzicht"><span>📈</span>Inzicht</button>
  <button data-tab="check"><span>✅</span>Check-in</button>
  <button data-tab="meer"><span>⚙️</span>Meer</button>
</nav>
<script>
'use strict';
/* ==== VASTE AFSPRAKEN — zie ONDERHOUD.md. NOOIT WIJZIGEN: KEY, oefeningcodes, bestaande QSETS-versies. ==== */
const KEY = 'yorick-coach';
const APP_VERSION = '2.0.0';
const SCHEMA = 2;

/* Check-in vragen per versie. Een bestaande versie NOOIT aanpassen; voeg een nieuwe versie toe. */
const QSETS = {
  1: [
    {k:'cijfer', q:'Cijfer voor deze week', t:'scale', min:1, max:10},
    {k:'zwaarte', q:'Zwaarte van de week (gem. sessie-RPE)', t:'scale', min:1, max:10},
    {k:'herstel', q:'Slaap & herstel (1 slecht – 5 top)', t:'scale', min:1, max:5},
    {k:'oura', q:'Oura: gem. HRV / rust-HF (optioneel)', t:'text'},
    {k:'pijn', q:'Pijntjes: waar, 0–10, wanneer (leeg = geen)', t:'area'},
    {k:'besch', q:'Beschikbaarheid volgende week', t:'avail'},
    {k:'richting', q:'Volgende week', t:'pick', opts:['Tandje erbij','Zo laten','Terug']},
    {k:'opm', q:'Overig voor de coach', t:'area'}
  ],
  2: [
    {k:'cijfer', q:'Cijfer voor deze week', t:'scale', min:1, max:10},
    {k:'benen', q:'Benen aan het eind van de week (1 kapot – 5 fris)', t:'scale', min:1, max:5},
    {k:'pijn', q:'Pijntjes: waar, 0–10, wanneer (leeg = geen)', t:'area'},
    {k:'richting', q:'Volgende week', t:'pick', opts:['Tandje erbij','Zo laten','Terug']},
    {k:'opm', q:'Overig voor de coach', t:'area'}
  ]
};
const QV_CURRENT = 2;
const TYPE_LABEL = {run:'Lopen',bike:'Fiets',swim:'Zwem',strength:'Kracht',plyo:'Plyo',hyrox:'Hyrox',mobility:'Mobiliteit',rest:'Rust',race:'Wedstrijd'};
const DAYS = ['ma','di','wo','do','vr','za','zo'];
const SLOTS = ['Niet','1×','2×','Alleen ochtend','Alleen avond','Lang'];
const SKIPS = ['Ziek','Agenda','Vermoeid','Pijn','Weer','Anders'];
const MAIN_LIFTS = ['SQ','RDL','BSS','HT','BP','OHP','PU','LP'];
const SPORTMAP = {run:['Run','TrailRun','VirtualRun'], race:['Run','TrailRun','VirtualRun'], bike:['Ride','VirtualRide','GravelRide','MountainBikeRide'],
  swim:['Swim'], strength:['WeightTraining'], hyrox:['Workout','HighIntensityIntervalTraining','Crossfit','WeightTraining']};
const RUNS = ['Run','TrailRun','VirtualRun'];

/* ---------- opslag ---------- */
function blank(){ return {schema:SCHEMA, done:{}, moves:{}, swaps:{}, sets:[], cardio:[], checkins:{}, avail:{}, daily:{},
  settings:{ftp:null,lthr:null,tpace:null,sheetUrl:'',lastBackup:null,seenPlan:null}, queue:[]}; }
function migrate(o){
  const b = blank();
  if(!o || typeof o !== 'object') return b;
  for(const k of Object.keys(b)) if(o[k] === undefined || o[k] === null) o[k] = b[k];
  if(typeof o.settings!=='object') o.settings = b.settings;
  for(const k of Object.keys(b.settings)) if(o.settings[k] === undefined) o.settings[k] = b.settings[k];
  for(const k of ['sets','cardio','queue']) if(!Array.isArray(o[k])) o[k] = [];
  o.schema = Math.max(o.schema||1, SCHEMA);
  return o; // onbekende velden blijven bewaard
}
function load(){ try { return migrate(JSON.parse(localStorage.getItem(KEY))); } catch(e){ return blank(); } }
let S = load();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){ toast('Opslaan mislukt: '+e.message); } }
function enqueue(kind, id, date, data){
  S.queue = S.queue.filter(q => !(q.kind===kind && q.id===id));
  S.queue.push({kind, id, date, data, ts:Date.now()});
  save(); scheduleSync();
}

/* ---------- data ---------- */
let PLAN = null, STRAVA = {activities:[]};
async function loadData(){
  try { const r = await fetch('plan.json', {cache:'no-cache'}); PLAN = await r.json(); } catch(e){ PLAN = null; }
  try { const r = await fetch('strava.json', {cache:'no-cache'}); if(r.ok) STRAVA = await r.json(); } catch(e){}
}
const EXN = c => (PLAN && PLAN.exercises[c]) || {n:c, inc:2.5};
const unitOf = c => EXN(c).u || 'kg';
const setting = k => S.settings[k] ?? (PLAN && PLAN.athlete[k]);
const num = v => { if(v===null || v===undefined) return null; const s = String(v).trim().replace(',', '.'); if(s==='') return null; const n = Number(s); return isNaN(n) ? null : n; };

/* ---------- datum ---------- */
const pad = n => String(n).padStart(2,'0');
function iso(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function today(){ return iso(new Date()); }
function parseD(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d, 12); }
function addDays(s, n){ const d = parseD(s); d.setDate(d.getDate()+n); return iso(d); }
function weekIdOf(s){ const d = parseD(s); const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dn = (t.getUTCDay()+6)%7; t.setUTCDate(t.getUTCDate()-dn+3); const fy = t.getUTCFullYear();
  const f = new Date(Date.UTC(fy,0,4)); const w = 1 + Math.round(((t - f)/864e5 - 3 + ((f.getUTCDay()+6)%7))/7);
  return fy+'-W'+pad(w); }
function mondayOf(s){ const d = parseD(s); const dn = (d.getDay()+6)%7; return addDays(s, -dn); }
const MND = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
function fmtDay(s){ const d = parseD(s); return DAYS[(d.getDay()+6)%7]+' '+d.getDate()+' '+MND[d.getMonth()]; }
function fmtSec(t){ t = Math.round(t); const h = Math.floor(t/3600), m = Math.floor(t%3600/60), s = t%60; return h ? h+':'+pad(m)+':'+pad(s) : m+':'+pad(s); }
const fmtN = (n, d=1) => (Math.round(n*Math.pow(10,d))/Math.pow(10,d)).toString().replace('.', ',');
const fmtH = sec => fmtN(sec/3600)+' u';
const fmtKg = k => fmtN(k, 2);
function parseTime(str){ if(!str) return NaN; const p = String(str).trim().replace(',', '.').split(':').map(Number); if(p.some(isNaN)) return NaN;
  return p.length===3 ? p[0]*3600+p[1]*60+p[2] : p.length===2 ? p[0]*60+p[1] : p[0]*60; }

/* ---------- plan-hulpfuncties ---------- */
function weekByStart(start){ return PLAN && PLAN.weeks.find(w => w.start === start); }
function sessById(sid){ if(!PLAN) return null; for(const w of PLAN.weeks) for(const d of w.days) for(const s of d.s) if(s.id===sid) return {w, d, s, date:S.moves[sid]||d.date}; return null; }
function weekItems(w){ const out = []; if(!w) return out;
  for(const d of w.days) for(const s of d.s) out.push({s, orig:d.date, date:S.moves[s.id]||d.date});
  return out.sort((a,b)=> a.date.localeCompare(b.date) || a.s.id.localeCompare(b.s.id)); }
const isSkipped = sid => !!(S.done[sid]||{}).skip;

/* ---------- Strava-koppeling ---------- */
function actsIn(a, b){ return (STRAVA.activities||[]).filter(x => x.date>=a && x.date<=b); }
function matchWeek(w){
  const res = {by:{}, extra:[]}; if(!w) return res;
  const acts = actsIn(w.start, addDays(w.start,6)).slice().sort((a,b)=> (b.sec||0)-(a.sec||0)); const used = new Set();
  const items = weekItems(w).filter(i => SPORTMAP[i.s.t] && !isSkipped(i.s.id));
  const pri = t => ({race:0, run:1, bike:2, swim:3, hyrox:4, strength:5})[t] ?? 9;
  for(const it of items.slice().sort((a,b)=> pri(a.s.t)-pri(b.s.t))){
    const a = acts.find(x => !used.has(x.id) && x.date===it.date && SPORTMAP[it.s.t].includes(x.sport));
    if(a){ used.add(a.id); res.by[it.s.id] = a; } }
  res.extra = acts.filter(x => !used.has(x.id)).sort((a,b)=> a.date.localeCompare(b.date));
  return res;
}
function actLine(a){
  const p = [];
  if(a.km) p.push(fmtN(a.km,2)+' km'); if(a.sec) p.push(fmtSec(a.sec));
  if(a.km && a.sec && RUNS.includes(a.sport)) p.push(fmtSec(a.sec/a.km)+'/km');
  if(a.km && a.sec && a.sport.includes('Ride')) p.push(fmtN(a.km/(a.sec/3600))+' km/u');
  if(a.hr) p.push('HF '+Math.round(a.hr)); if(a.w) p.push(a.w+' W'); if(a.hm) p.push(a.hm+' hm');
  return p.join(' · ');
}
function lapsTable(a){
  if(!a.laps) return '';
  return '<table style="margin-top:6px"><tr><th>#</th><th class="r">m</th><th class="r">tijd</th><th class="r">tempo</th><th class="r">HF</th></tr>'+a.laps.map((l,i)=>
    '<tr><td>'+(i+1)+'</td><td class="r">'+l.m+'</td><td class="r">'+fmtSec(l.sec)+'</td><td class="r">'+(l.m?fmtSec(l.sec/(l.m/1000)):'')+'</td><td class="r">'+(l.hr||'')+'</td></tr>').join('')+'</table>';
}

/* ---------- UI-status ---------- */
const ui = {tab:'vandaag', week:mondayOf(today()), sid:null, prefill:null, chkWeek:null, restoreArmed:false, open:{}, menu:{}, laps:{}, swap:{}, rir:{}, sw:{}};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){ const t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(()=> t.style.display='none', 1800); }

/* ---------- rusttimer, flits, scherm aan ---------- */
let tEnd = 0, tInt = null, actx = null, wake = null;
function beep(){ try { actx = actx || new (window.AudioContext||window.webkitAudioContext)(); const o = actx.createOscillator(), g = actx.createGain();
  o.frequency.value = 880; o.connect(g); g.connect(actx.destination); g.gain.value = .25; o.start(); o.stop(actx.currentTime + .4); } catch(e){} }
function unlockAudio(){ try { actx = actx || new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); } catch(e){} }
function startTimer(sec){ if(!sec) return; tEnd = Date.now() + sec*1000; sessionStorage.setItem('tEnd', tEnd); $('timer').classList.add('show'); $('timer').classList.remove('end'); tick(); startTicker(); }
function startTicker(){ clearInterval(tInt); tInt = setInterval(tick, 250); }
function tick(){
  if(tEnd){ const left = Math.ceil((tEnd - Date.now())/1000);
    if(left <= 0){ $('tval').textContent = 'Rust voorbij'; if(!$('timer').classList.contains('end')){ $('timer').classList.add('end'); beep(); if(navigator.vibrate) navigator.vibrate([200,100,200]);
      const f = $('flash'); f.classList.remove('show'); void f.offsetWidth; f.classList.add('show'); setTimeout(()=> f.classList.remove('show'), 1700); } }
    else $('tval').textContent = fmtSec(left); }
  document.querySelectorAll('[data-swlive]').forEach(el => { const t0 = ui.sw[el.dataset.swlive]; if(t0) el.textContent = '■ Stop · '+fmtSec((Date.now()-t0)/1000); });
}
function stopTimer(){ tEnd = 0; sessionStorage.removeItem('tEnd'); $('timer').classList.remove('show','end'); }
async function keepAwake(on){ try { if(on && 'wakeLock' in navigator && !wake){ wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', ()=> wake = null); }
  else if(!on && wake){ await wake.release(); wake = null; } } catch(e){} }
document.addEventListener('visibilitychange', ()=> { if(document.visibilityState==='visible' && ui.tab==='log') keepAwake(true); });

/* ---------- zones (berekend) ---------- */
function hrZone(hr){ const l = Number(setting('lthr')); if(!hr || !l) return null; const p = hr/l*100;
  const z = p<85?'Z1 herstel':p<90?'Z2 aeroob':p<95?'Z3 tempo':p<100?'Z4 sub-drempel':p<=102?'Z5a drempel':p<=106?'Z5b VO2':'Z5c anaeroob';
  return z+' ('+Math.round(p)+'% LTHR)'; }
function paceZone(sec){ const t = Number(setting('tpace')); if(!sec || !t) return null; const r = sec/t;
  return r>1.29?'Z1 herstel':r>1.13?'Z2 aeroob':r>1.05?'Z3 tempo':r>1.00?'Z4 sub-drempel':r>=0.97?'Z5a drempel':r>=0.90?'Z5b VO2':'Z5c snelheid'; }
function powZone(w){ const f = Number(setting('ftp')); if(!w || !f) return null; const p = w/f*100;
  const z = p<=55?'Z1 herstel':p<=75?'Z2 duur':p<=90?'Z3 tempo':p<=105?'Z4 drempel':p<=120?'Z5 VO2':p<=150?'Z6 anaeroob':'Z7';
  return z+' ('+Math.round(p)+'% FTP)'; }
function calcCardio(c){
  const out = []; const sec = c.sec, km = c.km; const sp = c.sport==='trail' ? 'run' : c.sport;
  if(sec && km){ if(sp==='bike') out.push('Snelheid <b>'+fmtN(km/(sec/3600))+' km/u</b>');
    else if(sp==='swim') out.push('Tempo <b>'+fmtSec(sec/(km*10))+' /100 m</b>');
    else { const p = sec/km; out.push('Tempo <b>'+fmtSec(p)+' /km</b>'); const pz = paceZone(p); if(pz) out.push('Tempozone '+pz+' <span class="small">(vlak)</span>'); } }
  const hz = hrZone(c.hr); if(hz) out.push('HF-zone '+hz);

/* ---------- ochtendcheck (Oura) ---------- */
const dailyOf = d => S.daily[d] || {};
function advice(d){
  const x = dailyOf(d); if(x.rd==null && x.sl==null && x.legs==null && x.pain==null) return null;
  const prev = []; for(let i=1;i<=7;i++){ const y = dailyOf(addDays(d,-i)); if(y.rd!=null) prev.push(y.rd); }
  const av = prev.length ? prev.reduce((a,b)=>a+b,0)/prev.length : null; const why = [];
  let lvl = 'groen'; const up = l => { if(l==='rood' || (l==='oranje' && lvl==='groen')) lvl = l; };
  if(x.pain!=null && x.pain>=4){ up('rood'); why.push('pijn '+x.pain+'/10'); }
  if(x.rd!=null && x.rd<60){ up('rood'); why.push('readiness '+x.rd); }
  else if(x.rd!=null && x.rd<70){ up('oranje'); why.push('readiness '+x.rd); }
  if(x.sl!=null && x.sl<60){ up('oranje'); why.push('slaap '+x.sl); }
  if(x.legs!=null && x.legs<=2){ up('oranje'); why.push('benen '+x.legs+'/5'); }
  if(av!=null && x.rd!=null && x.rd <= av-10){ up('oranje'); why.push('readiness '+Math.round(av-x.rd)+' onder je 7-daags gemiddelde'); }
  const txt = {groen:'Plan uitvoeren zoals geschreven.',
    oranje:'Plan uitvoeren, maar kwaliteit op de onderkant van de tempo’s en RPE max. 1 lager. Voelt de warming-up zwaar: kwaliteit vervangen door easy.',
    rood:'Kwaliteit vandaag schrappen: 30–45 min easy (fiets/zwem) of rust. Bij pijn ≥ 4: niet belasten op die plek en melden in de notitie.'}[lvl];
  return {lvl, txt, why};
}

/* ---------- dubbele progressie met RIR ---------- */
function prevGroup(code, sid, date){
  const xs = S.sets.filter(x => x.code===code && x.sid!==sid && x.date<=date && !x.del);
  if(!xs.length) return null;
  const last = xs.reduce((a,b)=> a.date>b.date || (a.date===b.date && a.ts>b.ts) ? a : b);
  return S.sets.filter(x => x.code===code && x.sid===last.sid && !x.del).sort((a,b)=>a.ts-b.ts);
}
function suggest(e, code, prev){
  const u = unitOf(code), inc = EXN(code).inc, tgt = e.rir ?? 2;
  if(!prev) return {kg:null, txt: u==='kg' && !EXN(code).time ? 'Eerste keer: kies een gewicht waarmee je '+e.lo+'–'+e.hi+' haalt bij RIR '+tgt+'.' : 'Doel: '+e.lo+(e.hi!==e.lo?'–'+e.hi:'')+' '+(u==='kg'?'reps':u)+'.'};
  if(EXN(code).time){ const t = prev.filter(x=>x.sec).map(x=>x.sec); return {kg: Math.max(...prev.map(x=>Number(x.kg)||0)) || null, txt: t.length ? 'Vorige keer '+t.map(fmtSec).join(', ')+'. Doel: gelijk of sneller bij zelfde RPE.' : 'Doel: '+e.lo+' '+u+'.'}; }
  const kg = Math.max(...prev.map(x=>Number(x.kg)||0));
  const top = prev.filter(x => (Number(x.kg)||0)===kg); const rir = x => x.rir ?? tgt;
  const minR = Math.min(...top.map(x=>x.reps)); const minRir = Math.min(...top.map(rir)), maxRir = Math.max(...top.map(rir));
  if(u!=='kg') return {kg: kg||null, txt:'Vorige keer '+top.map(x=>x.reps).join(', ')+' '+u+(kg?' @ '+fmtKg(kg)+' kg':'')+'. Doel: gelijk of +1.'};
  if(!inc) return {kg: kg||null, txt:'Vorige keer '+top.map(x=>x.reps).join(', ')+'. Doel +1 rep per set.'};
  const allHi = top.length >= e.s && top.every(x => x.reps >= e.hi);
  if(allHi && minRir >= tgt) return {kg: +(kg+inc).toFixed(2), txt:'Alle sets op '+e.hi+' bij RIR ≥ '+tgt+' → <b>'+fmtKg(kg+inc)+' kg</b> × '+e.lo+'–'+e.hi};
  if(minR >= e.lo && top.every(x => rir(x) >= tgt+2)) return {kg: +(kg+inc).toFixed(2), txt:'Te licht (RIR '+maxRir+') → <b>'+fmtKg(kg+inc)+' kg</b>'};
  if(allHi && minRir < tgt) return {kg, txt:'Reps gehaald maar zwaarder dan bedoeld (RIR '+minRir+'). Blijf op <b>'+fmtKg(kg)+' kg</b> tot het op RIR '+tgt+' lukt.'};
  if(minR < e.lo && minRir <= 0) return {kg: Math.max(0, +(kg-inc).toFixed(2)), txt:'Onder het bereik op falen → <b>'+fmtKg(Math.max(0,kg-inc))+' kg</b>'};
  return {kg: kg||null, txt:'Zelfde gewicht <b>'+fmtKg(kg)+' kg</b>, mik op '+Math.min(e.hi, minR+1)+'+ reps bij RIR '+tgt};
}

/* ---------- weekcijfers ---------- */
function manualUnlinked(a, b, m){ return S.cardio.filter(c => !c.del && c.date>=a && c.date<=b && !(c.sid && m.by[c.sid])); }
function weekStats(w){
  const a = w.start, b = addDays(w.start,6), m = matchWeek(w), items = weekItems(w);
  const st = {runPlan:0, runDone:0, vertPlan:w.vert||0, vertDone:0, minPlan:0, secDone:0, sessPlan:0, sessDone:0, load:0, groups:{}, rd:[], sl:[]};
  for(const it of items){ const s = it.s; if(['rest','mobility'].includes(s.t)) continue;
    st.sessPlan++; if((S.done[s.id]||{}).d || m.by[s.id]) st.sessDone++;
    if(['run','race'].includes(s.t)) st.runPlan += s.km||0;
    st.minPlan += s.min||0;
    const d = S.done[s.id]||{}; const mins = num(d.min) || (m.by[s.id] ? m.by[s.id].sec/60 : 0); if(d.rpe && mins) st.load += d.rpe*mins; }
  for(const x of actsIn(a,b)){ st.secDone += x.sec||0; if(RUNS.includes(x.sport)){ st.runDone += x.km||0; st.vertDone += x.hm||0; } }
  for(const c of manualUnlinked(a,b,m)){ st.secDone += c.sec||0; if(['run','trail'].includes(c.sport)) st.runDone += c.km||0; st.vertDone += c.hm||0;
    if(c.rpe && c.sec && !(c.sid && (S.done[c.sid]||{}).rpe)) st.load += c.rpe*c.sec/60; }
  for(const x of S.sets) if(!x.del && x.date>=a && x.date<=b && (x.rir==null || x.rir<=4)){ const g = EXN(x.code).g || 'overig'; st.groups[g] = (st.groups[g]||0)+1; }
  for(let i=0;i<7;i++){ const y = dailyOf(addDays(a,i)); if(y.rd!=null) st.rd.push(y.rd); if(y.sl!=null) st.sl.push(y.sl); }

}
const avg = xs => xs.length ? Math.round(xs.reduce((p,q)=>p+q,0)/xs.length) : null;
function statsCard(w){

  h += kv('Hoogtemeters', st.vertPlan+' m', Math.round(st.vertDone)+' m'); if(st.vertPlan) h += '<div class="bar"><i style="width:'+pct(st.vertDone,st.vertPlan)+'%"></i></div>';

function barSvg(vals, labels, opt){
  opt = opt||{}; const W = 320, H = 110, pb = 16, max = Math.max(1, ...vals, opt.target||0); const bw = W/vals.length;
  let s = '<svg viewBox="0 0 '+W+' '+(H+pb)+'" width="100%" role="img">';
  vals.forEach((v,i) => { const h = v/max*(H-12); s += '<rect x="'+(i*bw+3)+'" y="'+(H-h)+'" width="'+(bw-6)+'" height="'+h+'" rx="3" fill="'+(i===vals.length-1?'#60a5fa':'#22c55e')+'"/>';
    if(v) s += '<text x="'+(i*bw+bw/2)+'" y="'+(H-h-3)+'" text-anchor="middle">'+(opt.fmt?opt.fmt(v):Math.round(v))+'</text>';
    s += '<text x="'+(i*bw+bw/2)+'" y="'+(H+12)+'" text-anchor="middle">'+labels[i]+'</text>'; });
  return s+'</svg>';
}
function lineSvg(series){
  const W = 320, H = 110; const all = series.flatMap(x=>x.pts.map(p=>p[1])); if(!all.length) return '';
  const xs = series.flatMap(x=>x.pts.map(p=>p[0])); const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const lo = Math.min(...all)*0.95, hi = Math.max(...all)*1.05; const X = v => x1===x0 ? W/2 : (v-x0)/(x1-x0)*(W-40)+10; const Y = v => H-10-(v-lo)/((hi-lo)||1)*(H-20);
  let s = '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img">';
  for(const sr of series){ if(!sr.pts.length) continue; s += '<polyline fill="none" stroke="'+sr.c+'" stroke-width="2" points="'+sr.pts.map(p=>X(p[0])+','+Y(p[1])).join(' ')+'"/>';
    sr.pts.forEach(p => s += '<circle cx="'+X(p[0])+'" cy="'+Y(p[1])+'" r="2.5" fill="'+sr.c+'"/>');
    const l = sr.pts[sr.pts.length-1]; s += '<text x="'+(X(l[0])+5)+'" y="'+(Y(l[1])+4)+'">'+fmtN(l[1])+'</text>'; }
  return s+'</svg>';
}

  const rdp = [], slp = []; for(let i=27;i>=0;i--){ const y = dailyOf(addDays(t,-i)); if(y.rd!=null) rdp.push([28-i, y.rd]); if(y.sl!=null) slp.push([28-i, y.sl]); }

  for(let i=0;i<7;i++){ const dd = addDays(nextMon,i); const x = (av.d||{})[i] || {};
    h += '<div style="border-top:1px solid var(--line);margin-top:10px;padding-top:8px"><b>'+fmtDay(dd)+'</b>'+(i===2||i===4?' <span class="small">(vaak thuiswerk)</span>':'');
    h += '<div class="chips sm">'+SLOTS.map(sl => '<button class="chip'+(x.slot===sl?' on':'')+'" style="font-size:14px" data-av="'+nid+'" data-i="'+i+'" data-slot="'+sl+'">'+sl+'</button>').join('')+'</div>';
    h += '<div class="row nw"><input class="num" type="text" inputmode="numeric" placeholder="max min" data-avmin="'+nid+'" data-i="'+i+'" value="'+esc(x.min||'')+'"><input type="text" placeholder="bijv. pas na 19:00, gym met maat" data-avnote="'+nid+'" data-i="'+i+'" value="'+esc(x.note||'')+'"></div></div>'; }
  h += '<label class="f">Algemeen (reizen, events, wensen)</label><input type="text" data-avn="'+nid+'" value="'+esc(av.n||'')+'"></div>';
  return h;
}
function setAvail(nid, i, patch){ const av = S.avail[nid] || (S.avail[nid] = {d:{}, n:''}); if(i==null) Object.assign(av, patch); else av.d[i] = Object.assign({}, av.d[i]||{}, patch); av.ts = Date.now(); enqueue('avail', nid, nid, av); }
function setAns(k, v){ const wid = weekIdOf(ui.chkWeek); const ci = S.checkins[wid] || (S.checkins[wid] = {qv:QV_CURRENT, a:{}});
  ci.a[k] = v; ci.ts = Date.now(); enqueue('checkin', wid, ui.chkWeek, ci); }
function setDaily(d, k, v){ const x = S.daily[d] || (S.daily[d] = {}); if(v===null) delete x[k]; else x[k] = v; x.ts = Date.now(); enqueue('daily', d, d, x); }

/* ---------- export ---------- */
function weekText(start){
  const w = weekByStart(start); const wid = weekIdOf(start); const end = addDays(start, 6); const L = []; const m = matchWeek(w);
  L.push('WEEK '+wid+' ('+fmtDay(start)+' – '+fmtDay(end)+')'+(w?' · '+w.phase+' · '+w.status:'')+' · app '+APP_VERSION);
  L.push('Legenda: [x] afgevinkt · [S] alleen in Strava · [–] overgeslagen · [ ] niet gedaan');
  for(let i=0;i<7;i++){ const dd = addDays(start,i); const its = weekItems(w).filter(x => x.date===dd); const y = dailyOf(dd);
    const ex = m.extra.filter(x => x.date===dd); const hasD = y.rd!=null||y.sl!=null||y.legs!=null||y.pain!=null;
    if(!its.length && !ex.length && !hasD) continue;
    L.push(''); L.push(fmtDay(dd).toUpperCase()+(hasD ? '  [Oura readiness '+(y.rd??'–')+', slaap '+(y.sl??'–')+(y.hrv!=null?', HRV '+y.hrv:'')+(y.rhr!=null?', rust-HF '+y.rhr:'')+(y.legs!=null?', benen '+y.legs+'/5':'')+(y.pain!=null?', pijn '+y.pain+'/10':'')+']' : ''));
    for(const it of its){ const s = it.s, st = S.done[s.id] || {}, a = m.by[s.id];
      const mark = st.skip ? '[–]' : st.d ? '[x]' : a ? '[S]' : '[ ]';
      L.push(mark+' '+s.title+(s.km?' (gepland '+s.km+' km)':'')+(it.date!==it.orig?' · verplaatst van '+fmtDay(it.orig):'')+(st.skip?' · overgeslagen: '+st.skip:'')+(st.rpe?' · RPE '+st.rpe:'')+(st.min?' · '+st.min+' min':'')+(st.note?' · "'+st.note+'"':''));
      if(a){ L.push('    Strava: '+actLine(a)); if(a.laps) L.push('    Ronden: '+a.laps.map(l => l.m+'m '+fmtSec(l.sec)+(l.hr?'@'+l.hr:'')).join(', ')); }
      const sets = S.sets.filter(x => x.sid===s.id && !x.del).sort((a,b)=>a.ts-b.ts);
      if(sets.length){ const g = {}; for(const x of sets) (g[x.code] = g[x.code] || []).push((x.kg?fmtKg(x.kg)+'×':'')+x.reps+(x.rir!=null?'@'+x.rir:'')+(x.sec?' ('+fmtSec(x.sec)+')':''));
        for(const c in g){ const pc = sets.find(x=>x.code===c).pc; L.push('    '+EXN(c).n+(pc && pc!==c?' (i.p.v. '+EXN(pc).n+')':'')+': '+g[c].join(', ')); } } }
    for(const a of ex) L.push('[+] Niet gepland, Strava: '+a.name+' · '+actLine(a));
  }
  const cs = S.cardio.filter(c => !c.del && c.date>=start && c.date<=end).sort((a,b)=>a.date.localeCompare(b.date));
  if(cs.length){ L.push(''); L.push('HANDMATIG GELOGD'); for(const c of cs) L.push('- '+fmtDay(c.date)+' '+c.sport+(c.race?' (wedstrijd/test)':'')+': '+[c.km?fmtN(c.km,2)+' km':'', c.sec?fmtSec(c.sec):'', c.hr?c.hr+' bpm':'', c.w?c.w+' W':'', c.hm?c.hm+' hm':'', c.rpe?'RPE '+c.rpe:''].filter(Boolean).join(' ')+(c.kh||c.wat?' · voeding '+(c.kh?c.kh+' g/u ':'')+(c.wat||'')+(c.maag?' maag '+c.maag+'/5':''):'')+(c.note?' · '+c.note:'')+' | berekend: '+calcCardio(c).join('; ').replace(/<[^>]+>/g,'')); }
  if(w && w.days.length){ const st = weekStats(w); L.push(''); L.push('WEEKCIJFERS (gepland → gedaan)');
    L.push('Sessies '+st.sessPlan+' → '+st.sessDone+' · Lopen '+fmtN(st.runPlan)+' → '+fmtN(st.runDone)+' km · Hoogtemeters '+st.vertPlan+' → '+Math.round(st.vertDone)+' · Tijd '+fmtH(st.minPlan*60)+' → '+fmtH(st.secDone)+' · sRPE '+Math.round(st.load));
    L.push('Krachtsets per groep: '+(Object.entries(st.groups).map(([g,n])=>g+' '+n).join(', ')||'–'));
    if(st.rd.length||st.sl.length) L.push('Oura gemiddeld: readiness '+(avg(st.rd)??'–')+', slaap '+(avg(st.sl)??'–')); }
  const ci = S.checkins[wid];
  L.push(''); if(ci){ L.push('CHECK-IN (vragenset v'+ci.qv+')'); for(const q of QSETS[ci.qv]){ let v = ci.a[q.k];
      if(q.t==='avail'){ if(!v) continue; const nm = addDays(start,7); v = [0,1,2,3,4,5,6].map(i => fmtDay(addDays(nm,i)).split(' ')[0]+': '+(v[i]||'–')).join(', ')+(v.n?' · '+v.n:''); }
      L.push('- '+q.q+': '+(v===undefined||v===''?'–':v)); } }
  else L.push('CHECK-IN: niet ingevuld');
  const nm = addDays(start,7), nid = weekIdOf(nm), av = S.avail[nid];
  L.push(''); L.push('BESCHIKBAARHEID '+nid);
  if(av){ for(let i=0;i<7;i++){ const x = (av.d||{})[i] || {}; L.push('- '+fmtDay(addDays(nm,i))+': '+(x.slot||'–')+(x.min?' · max '+x.min+' min':'')+(x.note?' · '+x.note:'')); } if(av.n) L.push('- Algemeen: '+av.n); }
  else L.push('- niet ingevuld');
  return L.join('\n');
}
function backupCode(){ const j = JSON.stringify(S); return 'YC1:'+btoa(unescape(encodeURIComponent(j))); }
function parseBackup(code){ code = code.trim(); if(code.startsWith('YC1:')) code = code.slice(4);
  const j = code.startsWith('{') ? code : decodeURIComponent(escape(atob(code))); const o = JSON.parse(j);
  if(!o || typeof o!=='object' || !('sets' in o)) throw new Error('Geen geldige back-up'); return migrate(o); }

function rMeer(){
  $('htitle').textContent = 'Meer';
  const st = S.settings; const wk = mondayOf(today());
  const base = location.href.replace(/[#?].*$/,'').replace(/[^/]*$/,'');
  let h = '<div class="card"><h3>Week exporteren</h3><div class="mut">Zondag: plak dit in de chat (of gebruik de knop op Check-in).</div>';
  h += '<div class="row"><select id="x_week">'+[-1,0].map(o => { const s = addDays(wk, o*7); return '<option value="'+s+'"'+(o===0?' selected':'')+'>Week '+weekIdOf(s).split('-W')[1]+' ('+fmtDay(s)+')</option>'; }).join('')+'</select></div>';
  h += '<div class="row"><button class="btn pri" id="x_text">Kopieer weektekst</button><button class="btn" id="x_json">Kopieer back-upcode</button></div>';
  h += '<textarea id="x_out" readonly style="margin-top:10px;min-height:120px" placeholder="Hier verschijnt de export."></textarea>';
  h += '<div class="small">Laatste back-up: '+(st.lastBackup?fmtDay(iso(new Date(st.lastBackup))):'nooit')+'</div></div>';
  h += '<div class="card"><h3>Agenda</h3><div class="mut">Eén keer abonneren; je agenda werkt zichzelf bij (iPhone ververst periodiek, niet direct).</div>';
  h += '<div class="row"><a class="btn pri" id="ics_sub" style="display:flex;align-items:center;justify-content:center;text-decoration:none" href="'+base.replace(/^https?:/,'webcal:')+'ics/all.ics">📆 Abonneer op trainingsagenda</a></div><div class="small" style="word-break:break-all">'+esc(base)+'ics/all.ics</div></div>';
  h += '<div class="card"><h3>Herstellen</h3><div class="mut">Plak een back-upcode (begint met YC1:).</div><textarea id="r_in" style="margin-top:8px"></textarea>';
  h += '<div class="row"><button class="btn '+(ui.restoreArmed?'bad':'warn')+'" id="r_go">'+(ui.restoreArmed?'Bevestig: alles vervangen':'Herstel back-up')+'</button></div>';
  if(localStorage.getItem(KEY+'.undo')) h += '<div class="row"><button class="btn" id="r_undo">↶ Laatste herstel ongedaan maken</button></div>';
  h += '</div>';
  h += '<div class="card"><h3>Instellingen</h3><div class="small">Leeg = waarde uit het plan.</div>';
  h += '<div class="row"><div><label class="f">FTP (W)</label><input id="s_ftp" type="text" inputmode="numeric" placeholder="'+(PLAN?PLAN.athlete.ftp:'')+'" value="'+esc(st.ftp??'')+'"></div><div><label class="f">LTHR (bpm)</label><input id="s_lthr" type="text" inputmode="numeric" placeholder="'+(PLAN?PLAN.athlete.lthr:'')+'" value="'+esc(st.lthr??'')+'"></div></div>';
  h += '<label class="f">Drempeltempo (m:ss /km)</label><input id="s_tpace" type="text" inputmode="numeric" placeholder="'+(PLAN?fmtSec(PLAN.athlete.tpace):'')+'" value="'+(st.tpace?fmtSec(st.tpace):'')+'">';
  h += '<label class="f">Google Sheet web-app-URL (optioneel)</label><input id="s_url" type="url" placeholder="https://script.google.com/macros/s/…/exec" value="'+esc(st.sheetUrl||'')+'">';
  h += '<div class="row"><button class="btn pri" id="s_save">Bewaar instellingen</button><button class="btn" id="s_sync">Sync nu ('+S.queue.length+')</button></div>';
  h += '<div class="small" style="margin-top:8px">Wachtrij: '+S.queue.length+' item(s). Versturen gaat zonder ontvangstbevestiging (no-cors). Leidend blijft je back-upcode.</div></div>';
  h += '<div class="card"><h3>Handmatig loggen</h3><div class="row"><button class="btn" data-manual="1">＋ Duursessie zonder Strava</button></div></div>';
  h += '<div class="card small">App '+APP_VERSION+' · plan v'+(PLAN?PLAN.version+' ('+PLAN.updated+')':'–')+' · Strava '+esc(STRAVA.updated||'–')+' · opslag "'+KEY+'" ('+(ui.persist===true?'blijvend':ui.persist===false?'niet blijvend':'?')+') · '+S.sets.length+' sets, '+S.cardio.length+' duurlogs, '+Object.keys(S.daily).length+' ochtendchecks</div>';
  $('view').innerHTML = h;
}
async function copy(txt){ const o = $('x_out'); if(o) o.value = txt; try { await navigator.clipboard.writeText(txt); toast('Gekopieerd'); } catch(e){ if(o){ o.select(); try { document.execCommand('copy'); toast('Gekopieerd'); } catch(_){ toast('Selecteer en kopieer handmatig'); } } } }

/* ---------- sync naar Google Sheet ---------- */
let syncT = null;
function scheduleSync(){ clearTimeout(syncT); syncT = setTimeout(flush, 2000); }
async function flush(){
  const url = S.settings.sheetUrl; if(!url || !S.queue.length || !navigator.onLine) return;
  const batch = S.queue.slice(0, 50);
  try { await fetch(url, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(batch)});
    const sent = new Set(batch.map(b => b.kind+'|'+b.id+'|'+b.ts)); S.queue = S.queue.filter(q => !sent.has(q.kind+'|'+q.id+'|'+q.ts)); save();
    if(S.queue.length) scheduleSync(); if(ui.tab==='meer') rMeer();
  } catch(e){ /* offline: blijft in wachtrij */ }
}
window.addEventListener('online', scheduleSync);

/* ---------- events ---------- */
function rerender(){ const y = window.scrollY; render(); window.scrollTo(0, y); }
function exFor(code){ const f = sessById(ui.sid); return f && f.s.ex.find(x => (S.swaps[f.s.id+'|'+x.c]||x.c)===code); }
document.addEventListener('click', ev => {
  const b = ev.target.closest('button'); if(!b) return; const ds = b.dataset;
  if(ds.tab){ ui.tab = ds.tab; if(ds.tab==='log' && !ui.sid){ const it = weekItems(weekByStart(mondayOf(today()))).find(i => i.date===today() && i.s.ex && !isSkipped(i.s.id)); if(it) ui.sid = it.s.id; } window.scrollTo(0,0); render(); return; }
  if(ds.done){ const cur = (S.done[ds.done]||{}).d; setDone(ds.done, {d:!cur}); rerender(); return; }
  if(ds.srpe){ const cur = (S.done[ds.srpe]||{}).rpe, v = Number(ds.v); setDone(ds.srpe, {rpe: cur===v ? null : v}); rerender(); return; }
  if(ds.open){ const it = ui.tab==='vandaag'; ui.open[ds.open] = !(ui.open[ds.open] ?? it); rerender(); return; }
  if(ds.laps){ ui.laps[ds.laps] = !ui.laps[ds.laps]; rerender(); return; }
  if(ds.menu){ ui.menu[ds.menu] = !ui.menu[ds.menu]; rerender(); return; }
  if(ds.move){ const f = sessById(ds.move); if(ds.to===f.d.date) delete S.moves[ds.move]; else S.moves[ds.move] = ds.to; enqueue('move', ds.move, ds.to, {to:ds.to, from:f.d.date}); rerender(); toast('Verplaatst naar '+fmtDay(ds.to)); return; }
  if(ds.skip){ const cur = (S.done[ds.skip]||{}).skip; setDone(ds.skip, cur===ds.r ? {skip:null} : {skip:ds.r, d:false}); rerender(); return; }
  if(ds.reset){ delete S.moves[ds.reset]; setDone(ds.reset, {skip:null}); enqueue('move', ds.reset, '', {to:null}); rerender(); return; }
  if(ds.logger){ ui.sid = ds.logger; ui.tab = 'log'; window.scrollTo(0,0); render(); return; }
  if(ds.pick){ ui.sid = null; rLog(); return; }
  if(ds.cardio){ const f = sessById(ds.cardio); ui.prefill = {sid:ds.cardio, date:f.date, sport:({bike:'bike',swim:'swim'})[f.s.t]||'run'}; ui.tab='duur'; render(); window.scrollTo(0,0); return; }
  if(ds.manual){ ui.prefill = null; ui.tab = 'duur'; render(); window.scrollTo(0,0); return; }
  if(ds.seen){ S.settings.seenPlan = PLAN.version+'/'+PLAN.updated; save(); rerender(); return; }
  if(ds.kgd){ const inp = document.querySelector('[data-kg="'+ds.kgd+'"]'); const inc = EXN(ds.kgd).inc || 1; const v = (num(inp.value)||0) + inc*Number(ds.dir);
    inp.value = String(Math.max(0, +v.toFixed(2))).replace('.', ','); ui['kg_'+ui.sid+ds.kgd] = inp.value; return; }
  if(ds.rir){ ui.rir[ds.rir] = Number(ds.v); document.querySelectorAll('[data-rir="'+ds.rir+'"]').forEach(c => c.classList.toggle('on', c===b)); return; }
  if(ds.rep){ logSet(ds.rep, Number(ds.r)); return; }
  if(ds.repgo){ const i = document.querySelector('[data-repx="'+ds.repgo+'"]'); const v = num(i && i.value); if(v!=null) logSet(ds.repgo, v); return; }
  if(ds.swapopen){ ui.swap[ds.swapopen] = !ui.swap[ds.swapopen]; rerender(); return; }
  if(ds.swap){ const k = ui.sid+'|'+ds.swap; if(ds.to===ds.swap) delete S.swaps[k]; else S.swaps[k] = ds.to; save(); ui.swap[ds.swap] = false; rerender(); toast('Oefening: '+EXN(ds.to).n); return; }
  if(ds.sw){ const c = ds.sw; const e = exFor(c);
    if(!ui.sw[c]){ ui.sw[c] = Date.now(); unlockAudio(); stopTimer(); startTicker(); rerender(); }
    else { const sec = Math.round((Date.now()-ui.sw[c])/1000); ui.sw[c] = null; logSet(c, e.lo, {sec}); } return; }
  if(ds.secgo){ const i = document.querySelector('[data-secx="'+ds.secgo+'"]'); const sec = parseTime(i && i.value); const e = exFor(ds.secgo); if(!isNaN(sec) && e) logSet(ds.secgo, e.lo, {sec}); return; }
  if(ds.del){ const x = S.sets.find(s => s.id===ds.del); if(x){ x.del = true; x.ts2 = Date.now(); enqueue('set', x.id, x.date, x); } rerender(); return; }
  if(ds.rpe){ ui.rpe = Number(ds.rpe); document.querySelectorAll('[data-rpe]').forEach(c => c.classList.toggle('on', c===b)); updCalc(); return; }
  if(ds.maag){ ui.maag = Number(ds.maag); document.querySelectorAll('[data-maag]').forEach(c => c.classList.toggle('on', c===b)); return; }
  if(ds.cdel){ const c = S.cardio.find(x => x.id===ds.cdel); if(c){ c.del = true; enqueue('cardio', c.id, c.date, c); } rDuur(); return; }
  if(ds.ck){ setAns(ds.ck, ds.cv!==undefined ? Number(ds.cv) : ds.cvs); rerender(); return; }
  if(ds.dlyc){ const v = Number(ds.v); const cur = dailyOf(today())[ds.dlyc]; setDaily(today(), ds.dlyc, cur===v ? null : v); rerender(); return; }
  if(ds.slot){ const cur = (((S.avail[ds.av]||{}).d||{})[ds.i]||{}).slot; setAvail(ds.av, ds.i, {slot: cur===ds.slot ? null : ds.slot}); rerender(); return; }
  if(ds.tadd){ if(tEnd){ tEnd += Number(ds.tadd)*1000; $('timer').classList.remove('end'); tick(); } return; }
  switch(b.id){
    case 'prev': case 'next': { const n = b.id==='next' ? 7 : -7; if(ui.tab==='check') ui.chkWeek = addDays(ui.chkWeek||mondayOf(today()), n); else ui.week = addDays(ui.week, n); render(); return; }
    case 'tstop': stopTimer(); return;
    case 'c_save': { const c = cardioForm(); if(!c.date || (!c.km && !c.sec && !c.rpe && !c.kh)){ toast('Vul minstens afstand, tijd, RPE of voeding in'); return; }
      c.ts = Date.now(); c.id = 'c|'+c.date+'|'+c.ts;
      if(ui.prefill && ui.prefill.sid){ c.sid = ui.prefill.sid; const cur = S.done[c.sid]||{}; const patch = {}; if(!cur.d) patch.d = true; if(c.sec && !cur.min) patch.min = String(Math.round(c.sec/60)); if(c.rpe && !cur.rpe) patch.rpe = c.rpe; if(Object.keys(patch).length) setDone(c.sid, patch); }
      S.cardio.push(c); enqueue('cardio', c.id, c.date, c); ui.prefill = null; toast('Opgeslagen'); rDuur(); return; }
    case 'x_text': copy(weekText($('x_week').value)); return;
    case 'x_sunday': copy(weekText(ui.chkWeek||mondayOf(today()))); return;
    case 'x_json': S.settings.lastBackup = Date.now(); save(); copy(backupCode()); return;
    case 'r_go': { if(!ui.restoreArmed){ try { parseBackup($('r_in').value); } catch(e){ toast('Ongeldige code'); return; } ui.restoreArmed = true; const v = $('r_in').value; rMeer(); $('r_in').value = v; return; }
      try { const o = parseBackup($('r_in').value); try { localStorage.setItem(KEY+'.undo', JSON.stringify(S)); } catch(_){} S = o; save(); ui.restoreArmed = false; toast('Hersteld'); render(); } catch(e){ toast('Ongeldige code'); } return; }
    case 'r_undo': { try { S = migrate(JSON.parse(localStorage.getItem(KEY+'.undo'))); save(); localStorage.removeItem(KEY+'.undo'); toast('Herstel ongedaan gemaakt'); render(); } catch(e){ toast('Niets om terug te zetten'); } return; }
    case 's_save': { S.settings.ftp = num($('s_ftp').value); S.settings.lthr = num($('s_lthr').value);
      const tp = parseTime($('s_tpace').value); S.settings.tpace = isNaN(tp) ? null : tp; S.settings.sheetUrl = $('s_url').value.trim(); save(); toast('Bewaard'); scheduleSync(); return; }
    case 's_sync': flush().then(()=> toast(S.queue.length ? 'Nog '+S.queue.length+' in wachtrij' : 'Verstuurd')); return;
  }
});
document.addEventListener('change', ev => { const t = ev.target, ds = t.dataset;
  if(ds.min) setDone(ds.min, {min:t.value});
  if(ds.note) setDone(ds.note, {note:t.value});
  if(ds.ct) setAns(ds.ct, t.value);
  if(ds.dly){ setDaily(today(), ds.dly, num(t.value)); if(['rd','sl'].includes(ds.dly)) rerender(); }
  if(ds.avmin) setAvail(ds.avmin, ds.i, {min:t.value});
  if(ds.avnote) setAvail(ds.avnote, ds.i, {note:t.value});
  if(ds.avn) setAvail(ds.avn, null, {n:t.value});
  if(ds.kg) ui['kg_'+ui.sid+ds.kg] = t.value;
  if(t.id && t.id.startsWith('c_')) updCalc();
});
document.addEventListener('input', ev => { if(ev.target.id && ev.target.id.startsWith('c_')) updCalc(); });
document.addEventListener('keydown', ev => { const t = ev.target; if(ev.key==='Enter' && t.dataset && t.dataset.repx){ const v = num(t.value); if(v!=null) logSet(t.dataset.repx, v); } });

/* ---------- start ---------- */
(async function(){
  await loadData();
  const te = Number(sessionStorage.getItem('tEnd')); if(te > Date.now()){ tEnd = te; $('timer').classList.add('show'); startTicker(); tick(); }
  if(PLAN && !weekByStart(ui.week)){ const t = today(); const w = PLAN.weeks.filter(w => w.start<=t).pop() || PLAN.weeks[0]; ui.week = w.start; }
  render(); scheduleSync();
  try { if(navigator.storage && navigator.storage.persist){ ui.persist = await navigator.storage.persisted() || await navigator.storage.persist(); } } catch(e){}
  if('serviceWorker' in navigator){
    const had = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', ()=> { if(had) toast('App bijgewerkt naar de nieuwste versie'); });
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
})();
